<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="stylesheet" href="/app.css?v=20260407-2" />
    <script src="/config.js?v=20260407-2" defer></script>
    <script src="/reset-password.js?v=20260407-2" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="card">
        <h1>Password Reset</h1>
        <p class="sub">Enter your email to receive a secure reset link. The link expires in 5 minutes.</p>

        <form id="requestForm" class="auth-form">
          <h3>Request Reset Link</h3>
          <input id="requestEmail" type="email" placeholder="Email" required />
          <button type="submit">Send Reset Link</button>
        </form>

        <form id="confirmForm" class="auth-form hidden" style="margin-top: 12px">
          <h3>Set New Password</h3>
          <input id="newPassword" type="password" placeholder="New password" minlength="10" required />
          <button type="submit">Set New Password</button>
        </form>

        <div id="resetStatus" class="notice"></div>
        <p><a href="/">Back to login</a></p>
      </section>
    </main>
  </body>
</html>
